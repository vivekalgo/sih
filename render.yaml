services:
  - type: web
    name: privacyguard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ZERO_RETENTION_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
